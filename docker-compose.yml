services:
  # Database is hosted on Supabase (DATABASE_URL in apps/api/.env).
  # To self-host Postgres instead, add a postgres service here and point
  # DATABASE_URL at it, then seed from scripts/seed-data.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_started
    env_file:
      # DATABASE_URL (Supabase) + JWT_SECRET + GOOGLE_CLIENT_ID + GEMINI_API_KEY
      # + integration keys all come from here. Do NOT override DATABASE_URL.
      - ./apps/api/.env
    environment:
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  miniodata:
  caddydata:
  caddyconfig:

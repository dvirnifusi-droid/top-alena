server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed bundles (index-XXXX.js, index-XXXX.css, etc.) — content-addressable,
  # safe to cache forever. New deploys produce new filenames automatically.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # SPA fallback + the HTML shell — never cache. The shell is ~3KB; forcing
  # a fresh fetch on each visit guarantees users always see the latest bundle
  # references, while the hashed bundles themselves stay fast.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires 0;
  }
}

name: Provision GOOGLE_CLIENT_SECRET on VPS (one-shot)

# One-shot helper to set/update GOOGLE_CLIENT_SECRET in apps/api/.env
# and restart the API. Manual trigger only — key is passed as input so
# it never lands in git history. Delete this file after running once.

on:
  workflow_dispatch:
    inputs:
      google_client_secret:
        description: 'GOOGLE_CLIENT_SECRET from Google Cloud Console (starts with GOCSPX-)'
        required: true
        type: string

jobs:
  provision:
    name: Update .env and restart API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH to VPS, upsert GOOGLE_CLIENT_SECRET, restart, verify
        uses: appleboy/ssh-action@v1.0.3
        env:
          GS: ${{ inputs.google_client_secret }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          envs:     GS
          command_timeout: 3m
          script: |
            set -euo pipefail
            ENV_FILE=/opt/top-alena/apps/api/.env
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE not found"; exit 1
            fi
            if grep -q "^GOOGLE_CLIENT_SECRET=" "$ENV_FILE"; then
              sed -i "s|^GOOGLE_CLIENT_SECRET=.*|GOOGLE_CLIENT_SECRET=${GS}|" "$ENV_FILE"
              echo "==> updated existing GOOGLE_CLIENT_SECRET"
            else
              echo "GOOGLE_CLIENT_SECRET=${GS}" >> "$ENV_FILE"
              echo "==> appended new GOOGLE_CLIENT_SECRET"
            fi

            echo "==> recreating API container so env is reloaded"
            cd /opt/top-alena
            docker compose up -d api
            sleep 8

            echo "==> verifying env var landed inside the container"
            VALUE_IN=$(docker exec top-alena-api-1 sh -c 'echo ${GOOGLE_CLIENT_SECRET:0:10}...')
            echo "Container sees: ${VALUE_IN}"

            echo "==> probing /api/google/connect to confirm OAuth URL builds"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 0 \
              "http://localhost:3001/api/google/connect?phone=0532181900")
            echo "HTTP ${HTTP_CODE} from /api/google/connect"
            if [ "$HTTP_CODE" = "302" ]; then
              echo "==> SUCCESS — OAuth flow ready"
            else
              echo "==> WARNING — expected 302, got ${HTTP_CODE}"
            fi

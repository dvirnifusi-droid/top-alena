name: Provision CLUB_API_KEY on VPS (one-shot)

# One-shot helper to set/update CLUB_API_KEY in /opt/top-alena/apps/api/.env
# and restart the API. Manual trigger only — pass the key as an input so it
# never lands in git history.
#
# After it runs successfully ONCE, delete this file in a cleanup commit.

on:
  workflow_dispatch:
    inputs:
      club_api_key:
        description: 'The CLUB_API_KEY to write to apps/api/.env on the VPS'
        required: true
        type: string

jobs:
  provision:
    name: Update .env and restart API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH to VPS, upsert CLUB_API_KEY, restart, self-test
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Passed via env so the input never expands inline into the script,
          # preventing shell-injection if someone ever pastes a quote into it.
          CLUB_KEY: ${{ inputs.club_api_key }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          envs:     CLUB_KEY
          command_timeout: 3m
          script: |
            set -euo pipefail
            ENV_FILE=/opt/top-alena/apps/api/.env
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE not found"; exit 1
            fi

            if grep -q "^CLUB_API_KEY=" "$ENV_FILE"; then
              sed -i "s|^CLUB_API_KEY=.*|CLUB_API_KEY=${CLUB_KEY}|" "$ENV_FILE"
              echo "==> updated existing CLUB_API_KEY"
            else
              echo "CLUB_API_KEY=${CLUB_KEY}" >> "$ENV_FILE"
              echo "==> appended new CLUB_API_KEY"
            fi

            echo "==> restarting API container"
            cd /opt/top-alena
            docker compose restart api
            sleep 6

            echo "==> ping test:"
            HTTP_CODE=$(curl -s -o /tmp/club_ping_body -w "%{http_code}" \
              -H "X-Alena-Club-Key: ${CLUB_KEY}" \
              https://topalena.com/api/club/ping)
            echo "HTTP ${HTTP_CODE}"
            echo "Body: $(cat /tmp/club_ping_body)"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "==> SUCCESS"
            elif [ "$HTTP_CODE" = "503" ]; then
              echo "==> FAIL: 503 — env var still not loaded (container may not have re-read .env)"
              exit 1
            elif [ "$HTTP_CODE" = "401" ]; then
              echo "==> FAIL: 401 — key mismatch on server (the value in .env doesn't match what was passed)"
              exit 1
            else
              echo "==> FAIL: unexpected HTTP ${HTTP_CODE}"
              exit 1
            fi
